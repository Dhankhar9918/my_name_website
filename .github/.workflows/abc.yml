name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:

     #check code
      - name: Checkout Code
        uses: actions/checkout@v4

      #login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build image
      - name: Build Docker Image
        run: |
          docker build -t my-name_website .

      # 4. Add tag to image
      - name: Tag Docker Image
        run: |
          docker tag my-website:latest dhankhar9918/my-name_website:v1

      # 5. Push image Docker Hub
      - name: Push Docker Image
        run: |
          docker push dhankhar9918/my-name_website:v1